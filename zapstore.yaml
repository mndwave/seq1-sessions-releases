name: SEQ1 Sessions
summary: "Start with a chat. Grow into a computer."
description: |
  Start with a chat. Grow into a computer.

  **One conversation, everywhere.** Your chat follows you across your phone and your Mac, so you can pick up exactly
  where you left off.

  **A computer when you need one.** Ask for more and SEQ1 Sessions works in your own private environment: files you
  choose, a full terminal (SSH and mosh), and email drafts and your calendar, only as far as you grant access.

  **Sign in your way.** Use the link or six-digit code from your invitation email, or approve with your own Nostr key
  in Amber (NIP-55) or another remote signer (NIP-46). There is no password to look after.

  **Private by design.** This build contains no Google libraries: no Google Play services and no Firebase.
  Notifications arrive over UnifiedPush or the app's own live connection.

  SEQ1 Sessions is available by invitation. Ask for yours at sessions.seq1.net.
